[project]
name = "valveye"
version = "1.0.0"
description = "AI-powered Steam game price assistant with multi-agent architecture"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.13",
    "APScheduler>=3.11",
    "langchain>=1.2",
    "langchain-core>=1.3",
    "langchain-openai>=1.2",
    "langgraph>=1.1",
    "langgraph-checkpoint-sqlite>=3.0",
    "langgraph-prebuilt>=1.0",
    "openviking>=0.3.14",
    "python-dotenv>=1.2",
    "pydantic>=2.12",
    "prompt_toolkit>=3.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]
embeddings = [
    "sentence-transformers>=2.0",
]

[project.scripts]
valveye = "valveye.cli:main"
valveye-mcp = "valveye.mcp_server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langgraph.*",
    "langchain_core.*",
    "langchain_openai.*",
    "langgraph_checkpoint_sqlite.*",
    "langgraph_prebuilt.*",
    "openviking.*",
    "prompt_toolkit.*",
    "rich.*",
    "apscheduler.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require API keys and network access",
    "slow: tests that take more than 10 seconds",
]
